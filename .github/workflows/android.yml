name: Build Android APK
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      # 1. 刪除可能有問題的舊設定，讓 Flutter 重新產生乾淨的 Android 專案
      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --platforms android
          
      # 2. 設定 App 顯示名稱與網路權限
      - name: Setup App Config
        run: |
          sed -i 's/android:label="[^"]*"/android:label="AI 營養顧問"/g' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      # 3. 終極魔法：強制 App 與所有第三方套件 (包含 file_picker) 全部使用 SDK 36
      - name: Force SDK 36 Globally
        run: |
          # 升級 App 自身的 SDK
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts
          sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle.kts
          
          # 寫入全域設定，強迫所有套件覆寫為 SDK 36
          echo '
          subprojects {
              afterEvaluate {
                  val androidExt = extensions.findByName("android")
                  if (androidExt != null) {
                      (androidExt as com.android.build.gradle.BaseExtension).compileSdkVersion(36)
                  }
              }
          }' >> android/build.gradle.kts

      - run: flutter pub get
      
      - run: flutter pub run flutter_launcher_icons
      
      - run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
