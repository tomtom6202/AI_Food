name: Build Android APK
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      # 1. 建立 Android 專案資料夾
      - run: flutter create . --platforms android
      
      # 2. [保留你的設定] 替換 App 顯示名稱與加入網路權限
      - run: sed -i 's/android:label="[^"]*"/android:label="AI 營養顧問"/g' android/app/src/main/AndroidManifest.xml
      - run: sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
      
      # 3. [本次新增] 修正 Android 版本號以支援 share_plus 套件
      - name: Fix Android SDK Versions
        run: |
          sed -i "s/flutter.minSdkVersion/21/g" android/app/build.gradle
          sed -i "s/flutter.compileSdkVersion/34/g" android/app/build.gradle
          sed -i "s/flutter.targetSdkVersion/34/g" android/app/build.gradle
      
      # 4. 下載套件
      - run: flutter pub get
      
      # 5. [保留你的設定] 產生 App 圖示
      - run: flutter pub run flutter_launcher_icons
      
      # 6. 開始打包 APK
      - run: flutter build apk --release
      
      # 7. 輸出檔案供下載
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
