name: ai_food_tracker
description: A new Flutter project for AI food analysis.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

# ... (前略)
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.0.4
  http: ^1.1.0
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  flutter_launcher_icons: ^0.13.1
  file_picker: ^8.0.0+1 # 新增這個套件
# ... (後略)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

# 將標籤名稱更新，並關閉 iOS 圖示生成
flutter_launcher_icons:
  android: true
  ios: false  # <--- 這裡改成 false
  image_path: "icon.png"
